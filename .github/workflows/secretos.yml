name: Escaneo de secretos
# Falla el push o el PR si algún archivo versionado trae una contraseña, un par correo + contraseña, una llave de API o un token.
on:
  push:
  pull_request:
jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escanear todo lo versionado
        run: node scripts/seguridad/escanear-secretos.mjs --todo
